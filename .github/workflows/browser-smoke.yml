name: Browser smoke test
on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]
permissions:
  contents: read
jobs:
  viewport:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        suite: [small, wide, game, cpu, vision, finish]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.56.1 phaser@3.90.0
      - run: npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/bless-http.log 2>&1 &
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8000/ >/dev/null && break; sleep 1; done
          node test.mjs
          node prototype-test.mjs
          node feedback-test.mjs
          node native-test.mjs
          node polish-test.mjs
          node balance-test.mjs
          node --check app.mjs
          node --check presentation.mjs
          BLESS_BROWSER_SUITE=${{ matrix.suite }} node browser-test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bless-native-browser-evidence-${{ matrix.suite }}
          path: |
            screenshots/
            node_modules/phaser/dist/phaser.min.js
          retention-days: 3
