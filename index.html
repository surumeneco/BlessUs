<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f4f2fa">

</head>
<body>
  <svg class="symbol-defs" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs>
    <symbol id="i-heart" viewBox="0 0 24 24"><path d="M20.8 4.8c-2.7-2.8-6.5-1.6-8.8 1.1-2.3-2.7-6.1-3.9-8.8-1.1-3.8 4 0 9.1 8.8 15.2 8.8-6.1 12.6-11.2 8.8-15.2Z" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-stack" viewBox="0 0 24 24"><rect x="7" y="3" width="13" height="16" rx="2"/><path d="M4 7v13a1 1 0 0 0 1 1h12M12 7h4m-4 4h4"/></symbol>
    <symbol id="i-bolt" viewBox="0 0 24 24"><path d="m13 2-9 12h7l-1 8 10-12h-8Z" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v10M7 12h10"/></symbol>
    <symbol id="i-trophy" viewBox="0 0 24 24"><path d="M7 3h10v7a5 5 0 0 1-10 0V3ZM7 5H3v3c0 3 2 5 5 5M17 5h4v3c0 3-2 5-5 5M12 15v5M7 21h10"/></symbol>
    <symbol id="i-cardplus" viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="3"/><path d="M12 7v10m-5-5h10"/></symbol>
    <symbol id="i-repeat" viewBox="0 0 24 24"><path d="M4 9V6h15l-3-3m3 3-3 3M20 15v3H5l3 3m-3-3 3-3"/></symbol>
    <symbol id="i-swords" viewBox="0 0 24 24"><path d="m3 3 6 1 11 15-3 2L4 9 3 3Zm18 0-6 1-3 4M4 20l5-5M2 17l5 5m10-5 5-5"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><path d="M7 3h10M7 21h10M8 3c0 4 1 6 4 9-3 3-4 5-4 9m8-18c0 4-1 6-4 9 3 3 4 5 4 9"/></symbol>
    <symbol id="i-log" viewBox="0 0 24 24"><path d="M5 4h14v16H5zM8 8h8M8 12h8M8 16h5"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="m10 3 4 0 .5 3 2 .9 2.5-1.5 2.6 2.7-1.5 2.4.9 2 3 .5v4l-3 .5-.9 2 1.5 2.5-2.6 2.6-2.5-1.5-2 .9-.5 3h-4l-.5-3-2-.9L5 23 2.4 20.4l1.5-2.5-.9-2-3-.5v-4l3-.5.9-2L2.4 6.5 5 3.9l2.5 1.5 2-.9Z" transform="translate(2 2) scale(.83)"/></symbol>
    <symbol id="i-star" viewBox="0 0 24 24"><path d="m12 2 2.6 7.4L22 12l-7.4 2.6L12 22l-2.6-7.4L2 12l7.4-2.6Z" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="m15 5-7 7 7 7"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 5 5L20 7"/></symbol>
  </defs></svg>
  <div id="app" class="app-shell">
    <div class="startup" role="status" aria-live="polite">
      <h1>Bless Us</h1>
      <p id="startup-status">ゲームを読み込んでいます…</p>
      <noscript><p>JavaScriptを有効にしてから再読み込みしてください。</p></noscript>
    </div>
  </div>
  <div id="dialog" class="dialog-layer" hidden></div>
  <div id="tooltip" class="tooltip" hidden></div>
  <div id="dragGhost" class="drag-ghost" hidden></div>
  <div id="toast" role="status" class="toast" hidden></div>
  <script async src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js" onload="window.dispatchEvent(new Event('bless-phaser-ready'))"></script>
  <script type="module">
    const app = document.getElementById('app');
    const timeout = setTimeout(() => {
      const status = document.getElementById('startup-status');
      if (status) status.textContent = '読み込みに時間がかかっています。通信状態を確認してください。';
    }, 12000);
    try {
      await import('./app.mjs?v=20261125-feedback-1');
      if (!app.querySelector('.home')) throw new Error('ホーム画面を初期化できませんでした');
    } catch (error) {
      console.error('Bless Us startup failed', error);
      app.replaceChildren();
      const box = document.createElement('main');
      box.className = 'startup';
      const title = document.createElement('h1'); title.textContent = 'Bless Us';
      const message = document.createElement('p'); message.setAttribute('role', 'alert');
      message.textContent = 'ゲームを読み込めませんでした。ページを再読み込みしてください。';
      const detail = document.createElement('small'); detail.textContent = String(error);
      const retry = document.createElement('button'); retry.className = 'primary'; retry.textContent = '再読み込み';
      retry.addEventListener('click', () => location.reload());
      box.append(title, message, detail, retry); app.append(box);
    } finally { clearTimeout(timeout); }
  </script>
</body>
</html>
