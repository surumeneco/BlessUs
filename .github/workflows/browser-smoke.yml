name: Browser smoke test
on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]
  workflow_dispatch:
concurrency:
  group: bless-checks-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  rules:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node turn-resolution-test.mjs
          node lan-test.mjs
          node test.mjs
          node prototype-test.mjs
          node feedback-test.mjs
          node native-test.mjs
          node polish-test.mjs
          node balance-test.mjs
          node profile-test.mjs
          node --check lan.mjs
          node --check app.mjs
          node --check presentation.mjs
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: layout
            suites: small,wide,vision
          - group: game
            suites: game,cpu,finish
          - group: interactions
            suites: profile,chain,lan
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.56.1 phaser@3.90.0 peerjs@1.5.5 peer@1.0.2
      - run: npx playwright install chromium
      - run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ] && [ "$GITHUB_HEAD_REF" = perf/idle-and-ui ] && [ "${{ matrix.group }}" = layout ]; then
            mkdir -p .baseline
            git archive HEAD^1 | tar -x -C .baseline
            export BLESS_BASELINE_URL=http://127.0.0.1:8000/.baseline/
          fi
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/bless-http.log 2>&1 &
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8000/ >/dev/null && break; sleep 1; done
          node browser-test.mjs
        env:
          BLESS_BROWSER_SUITE: ${{ matrix.suites }}
          BLESS_CAPTURE_SCREENSHOTS: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
      - uses: actions/upload-artifact@v4
        if: failure() || github.event_name == 'workflow_dispatch'
        with:
          name: bless-browser-evidence-${{ matrix.group }}
          path: screenshots/
          retention-days: 3
