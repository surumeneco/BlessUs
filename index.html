<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bless Us | Prototype</title><style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#111825;color:#e4e9f3}body{max-width:1180px;margin:auto;padding:16px}h1{font-size:25px;margin:0}h2{font-size:18px;margin:12px 0}p{color:#bdc9da}button,input,textarea{font:inherit;background:#293950;color:inherit;border:1px solid #51627a;padding:7px;border-radius:5px}button{cursor:pointer}button:disabled{opacity:.4;cursor:default}label{display:inline-flex;align-items:center;gap:5px}input[type=number]{width:70px}section{background:#1a2434;border:1px solid #40516a;border-radius:8px;padding:12px;margin:10px 0}.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}#board{width:100%;aspect-ratio:1120/630;overflow:hidden;background:#151d2c}#choice button{display:block;text-align:left;width:100%;margin:5px 0}#log{max-height:320px;overflow:auto;white-space:pre-wrap;font-size:13px}#error{color:#ffb2a6}textarea{box-sizing:border-box;width:100%;height:180px}summary{cursor:pointer;padding:5px}#hands details div{font-size:13px;margin:3px 12px}#deckHelp{white-space:pre-wrap;font-size:12px}
</style><script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script></head><body>
<h1>Bless Us — 検証用モック</h1><p>同一端末で全プレイヤーを操作。自動試遊は簡易AIによる動作検証用。</p>
<section><div class="controls"><label>人数 <input id="players" type="number" min="2" max="6" value="4"></label><label>ラウンド <input id="rounds" type="number" min="1" value="3"></label><label>初期HP <input id="hp" type="number" min="1" value="10"></label><label>seed <input id="seed" type="number" value="1"></label><label>脱落時獲得率% <input id="chance" type="number" min="0" max="100" value="25"></label><button id="new">新規ゲーム</button></div><details><summary>初期デッキ（空欄＝標準30枚）</summary><button id="preset">標準デッキを展開</button><pre id="deckHelp"></pre><textarea id="deck" placeholder='[{"event":0},{"trigger":0,"effect":0},...]'></textarea><p>30〜40枚、各イベント1枚以上。新規ゲーム時に適用。</p></details><p id="error" role="alert"></p></section>
<section><p id="state" aria-live="polite"></p><div class="controls"><button id="start">ラウンド開始</button><button id="end">ターン終了</button><button id="step">AIで1操作</button><button id="auto">自動試遊開始</button><span id="status"></span></div></section>
<section id="choice" hidden></section><div id="board"></div><section><div class="controls"><label><input id="reveal" type="checkbox">全手札を表示</label><button id="download">検証ログJSON保存</button></div><div id="hands"></div><h2>処理ログ（直近160行）</h2><pre id="log"></pre></section><script type="module" src="./app.mjs"></script></body></html>
