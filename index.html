<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bless Us | Prototype</title><style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#111825;color:#e4e9f3}body{max-width:1180px;margin:auto;padding:16px}h1{font-size:25px;margin:0}h2{font-size:18px;margin:12px 0}p{color:#bdc9da}button,input,textarea{font:inherit;background:#293950;color:inherit;border:1px solid #51627a;padding:7px;border-radius:5px}button{cursor:pointer}button:disabled{opacity:.4;cursor:default}label{display:inline-flex;align-items:center;gap:5px}input[type=number]{width:70px}section{background:#1a2434;border:1px solid #40516a;border-radius:8px;padding:12px;margin:10px 0}.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}#board{width:100%;aspect-ratio:1120/630;overflow:hidden;background:#151d2c}#choice button{display:block;text-align:left;width:100%;margin:5px 0}#log{max-height:320px;overflow:auto;white-space:pre-wrap;font-size:13px}#error{color:#ffb2a6}textarea{box-sizing:border-box;width:100%;height:180px}summary{cursor:pointer;padding:5px}#hands details div{font-size:13px;margin:3px 12px}#deckHelp{white-space:pre-wrap;font-size:12px}
[hidden]{display:none!important}nav{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}.menu{display:grid;gap:12px;max-width:420px;margin:35px auto}.menu button{padding:18px;font-size:18px}.roster{display:grid;gap:7px;margin:12px 0}.seat{display:flex;align-items:center;gap:12px;padding:9px;background:#202e42;border-radius:5px}.seat span{flex:1}select{font:inherit;color:inherit;background:#293950;border:1px solid #51627a;padding:7px;border-radius:5px}.winner{font-size:25px;color:#e7dcad}#board{min-height:160px}#error{white-space:pre-wrap}.muted{color:#aebbd0}</style><script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script></head><body>
<header><h1>Bless Us</h1><p id="breadcrumb">ホーム</p></header>
<p id="error" role="alert"></p>
<main>
<section id="screen-home"><h2>ホーム</h2><div class="menu"><button id="goRoom">ルーム</button><button id="goDeck">デッキカスタマイズ</button><button id="goSettings">設定</button></div><p>モック：同一端末で手動プレイヤーとCPUを混在させて対戦できます。</p></section>
<section id="screen-room" hidden><h2>ルーム</h2><nav><button id="roomHome">ホームへ</button><button id="goRoomSettings">ルーム設定</button></nav><p id="roomSummary"></p><h3>参加プレイヤー</h3><div id="roster" class="roster"></div><div class="controls"><button id="addHuman">手動プレイヤー追加</button><button id="addCpu">CPU追加</button></div><nav><button id="new">ゲーム開始</button></nav></section>
<section id="screen-roomSettings" hidden><h2>ルーム設定</h2><div class="controls"><label>プレイヤー数 <input id="players" type="number" min="2" max="6" value="4"></label><label>ラウンド数 <input id="rounds" type="number" min="1" value="3"></label><label>初期体力 <input id="hp" type="number" min="1" value="10"></label><label>脱落者のアビリティ獲得確率 % <input id="chance" type="number" min="0" max="100" value="25"></label><label>初期デッキ <select id="deckMode"><option value="default">標準30枚</option><option value="custom">カスタム</option></select></label><label>乱数seed（検証用） <input id="seed" type="number" value="1"></label></div><nav><button id="saveRoom">適用してルームへ</button><button id="cancelRoom">変更せず戻る</button></nav></section>
<section id="screen-deck" hidden><h2>デッキカスタマイズ</h2><p>30〜40枚、各イベント1枚以上。保存したデッキはルーム設定で選択できます。</p><button id="preset">標準デッキを展開</button><pre id="deckHelp"></pre><textarea id="deck" placeholder='[{"event":0},{"trigger":0,"effect":0},...]'></textarea><nav><button id="saveDeck">保存してホームへ</button><button id="cancelDeck">変更せず戻る</button></nav></section>
<section id="screen-settings" hidden><h2>設定</h2><label>効果音量 <input id="volume" type="range" min="0" max="100" value="40"><output id="volumeValue">40%</output></label><nav><button id="settingsHome">ホームへ</button></nav></section>
<div id="screen-game" hidden><section><p id="state" aria-live="polite"></p><div class="controls"><button id="start">次のラウンドへ</button><button id="end">ターン終了</button><button id="pauseCpu">CPU一時停止</button><button id="quit">対戦を終了してルームへ</button><span id="status"></span></div></section><section id="choice" hidden></section><div id="board"></div><section><div class="controls"><label><input id="reveal" type="checkbox">全手札を表示</label><button id="download">検証ログJSON保存</button></div><h2>プレイヤー操作モード</h2><div id="gameModes" class="controls"></div><div id="hands"></div><h2>処理ログ（直近160行）</h2><pre id="log"></pre></section></div>
<section id="screen-result" hidden><h2>対戦結果</h2><p id="winner" class="winner"></p><div id="scores"></div><nav><button id="resultDownload">検証ログJSON保存</button><button id="resultRoom">ルームへ</button><button id="resultHome">ホームへ</button></nav></section>
</main><script type="module" src="./app.mjs"></script></body></html>
